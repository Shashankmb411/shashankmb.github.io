<!DOCTYPE html>
<html>
<head>
<title>Author Login</title>

<style>

body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
padding-top:120px;
}

.login-box{
background:black;
width:300px;
margin:auto;
padding:30px;
border-radius:10px;
}

input{
width:90%;
padding:10px;
margin:10px;
border:none;
border-radius:5px;
}

button{
padding:10px 20px;
background:#d4af37;
border:none;
font-weight:bold;
cursor:pointer;
}

</style>

<script>

function login(){

let username=document.getElementById("username").value;
let password=document.getElementById("password").value;

/* Author accounts */

if(username=="author1" && password=="1234"){
window.location="dashboard.html";
}
else{
alert("Invalid Login");
}

}

</script>

</head>

<body>

<div class="login-box">

<h2>Author Login</h2>

<input id="username" placeholder="Username"><br>

<input id="password" type="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

</div>

</body>
</html>
