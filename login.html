<!DOCTYPE html>
<html>
<head>
<title>Author Login</title>

<style>

body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
padding-top:150px;
}

.login-box{
background:black;
width:320px;
margin:auto;
padding:30px;
border-radius:10px;
}

input{
width:90%;
padding:10px;
margin:10px;
border:none;
border-radius:5px;
}

button{
padding:10px 20px;
background:#d4af37;
border:none;
font-weight:bold;
cursor:pointer;
}

</style>

<script>

/* USERS DATABASE */

let users = [
{username:"9123456789",password:"Abcdefghi1@"},
{username:"9234567890",password:"Bcdefghij2#"},
{username:"9345678901",password:"Cdefghijk3$"}
];

/* LOGIN FUNCTION */

function login(){

let username=document.getElementById("username").value;
let password=document.getElementById("password").value;

let user = users.find(u => u.username === username && u.password === password);

if(user){

localStorage.setItem("loggedIn","true");

window.location="index.html";

}

else{

alert("Invalid Login");

}

}

</script>

</head>

<body>

<div class="login-box">

<h2>Author Login</h2>

<input id="username" placeholder="Username"><br>

<input id="password" type="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

</div>

</body>
</html>
