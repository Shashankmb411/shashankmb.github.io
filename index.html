<!DOCTYPE html>
<html>
<head>
<title>Research Center</title>

<style>

body{
margin:0;
font-family: Arial;
text-align:center;

background-image: url("background.jpg");
background-size: cover;
background-position: center;
background-repeat: no-repeat;
height:100vh;
}

header{
background:black;
color:#d4af37;
padding:20px;
font-size:35px;
font-weight:bold;
position:relative;
}

.logo{
position:absolute;
right:20px;
top:10px;
width:60px;
}

nav{
background:#111;
padding:12px;
}

nav a{
color:#d4af37;
margin:20px;
text-decoration:none;
font-size:18px;
}

.search-box{
margin-top:120px;
}

input{
padding:12px;
width:300px;
border-radius:5px;
border:none;
}

button{
padding:12px 20px;
background:#d4af37;
border:none;
font-weight:bold;
cursor:pointer;
}

#results{
margin-top:40px;
}

#results h3{
color:black;
}

#results a{
color:black;
background:white;
padding:10px 20px;
display:inline-block;
margin:10px;
text-decoration:none;
border-radius:5px;
}

</style>

<script>

/* LOGIN CHECK */

window.onload=function(){

let loggedIn = sessionStorage.getItem("loggedIn");

if(loggedIn!="true"){
window.location="login.html";
}

};

/* LOGOUT */

function logout(){

sessionStorage.removeItem("loggedIn");

window.location="login.html";

}

/* SEARCH FUNCTION */

function searchPapers(){

let query=document.getElementById("search").value.toLowerCase();
let results=document.getElementById("results");

if(
query.includes("smart helmet") ||
query.includes("helmet") ||
query.includes("iot helmet")
){

results.innerHTML=`

<h3>Research Papers</h3>

<a href="smarthelmet.pdf" target="_blank">
Smart Helmet Accident Detection System
</a><br>

<a href="helmetiot.pdf" target="_blank">
IoT Based Smart Helmet System
</a><br>

<a href="helmetgps.pdf" target="_blank">
GPS Enabled Smart Helmet
</a>

`;

}

else{

results.innerHTML="<h3>No papers found</h3>";

}

}

</script>

</head>

<body>

<header>

RESEARCH CENTER

<img src="logo.png" class="logo">

</header>

<nav>

<a href="#">Home</a>
<a href="#">Browse Papers</a>
<a href="#">Authors</a>
<a href="#" onclick="logout()">Logout</a>

</nav>

<div class="search-box">

<h2>Search Research Papers</h2>

<input id="search" type="text" placeholder="Search research...">

<button onclick="searchPapers()">Search</button>

</div>

<div id="results"></div>

</body>
</html>
