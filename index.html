<!DOCTYPE html>
<html>
<head>
<title>Research Center</title>

<style>

body{
font-family: Arial;
background:#0b3d5c;
color:white;
text-align:center;
margin:0;
}

header{
background:#00334d;
padding:20px;
font-size:32px;
font-weight:bold;
position:relative;
}

.logo{
position:absolute;
right:20px;
top:10px;
width:60px;
}

.search-box{
margin-top:60px;
}

input{
padding:10px;
width:260px;
border:none;
}

button{
padding:10px 20px;
background:orange;
border:none;
cursor:pointer;
}

#results{
margin-top:40px;
}

#results h3{
color:white;
}

#results a{
color:black;
background:white;
padding:10px;
display:inline-block;
margin:10px;
text-decoration:none;
border-radius:5px;
}

</style>

<script>

function searchPapers(){

let query = document.getElementById("search").value.toLowerCase();
let results = document.getElementById("results");

if(
query.includes("smart helmet") ||
query.includes("smart helmet for minning") ||
query.includes("bike helmet") ||
query.includes("motorcycle helmet") ||
query.includes("helmet safety") ||
query.includes("accident helmet") ||
query.includes("iot helmet") ||
query.includes("rider safety") ||
query.includes("accident detection") ||
query.includes("helmet sensor") ||
query.includes("smart bike helmet") ||
query.includes("gps helmet") ||
query.includes("arduino helmet") ||
query.includes("safety helmet system") ||
query.includes("motorbike safety") ||
query.includes("helmet monitoring") ||
query.includes("intelligent helmet") ||
query.includes("helmet technology") ||
query.includes("helmet") ||
query.includes("helmet project")
){

results.innerHTML = `
<h3>Research Papers</h3>

<a href="smarthelmet.pdf" target="_blank">
Smart Helmet Accident Detection System
</a>

<br>

<a href="helmetiot.pdf" target="_blank">
IoT Based Smart Helmet System
</a>

<br>

<a href="helmetgps.pdf" target="_blank">
GPS Enabled Smart Helmet
</a>

`;

}

else{

results.innerHTML = "No papers found";

}

}

</script>

</head>

<body>

<header>

RESEARCH CENTER

<img src="logo.png" class="logo">

</header>

<div class="search-box">

<h2>Search Research Papers</h2>

<input id="search" type="text" placeholder="Search research...">

<button onclick="searchPapers()">Search</button>

</div>

<div id="results"></div>

</body>
</html>
